[package]
edition = "2021"
name = "pico-telemetry-hub"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[dependencies]
#srf05 = { path = "../crates/srf05" }
#motion-core = { path = "../crates/motion-core" }
mqtt-lite = { path = "../crates/mqtt-lite" }

embassy-executor = "0.10.0"
embassy-time = "0.5.1"
embassy-rp = { version = "0.10.0", features = [
    "rp2040",
    "time-driver",
    "critical-section-impl",
    "executor-thread",
] }
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "proto-ipv4", "auto-icmp-echo-reply","tcp"] }
embassy-futures = "0.1.2"
log = "0.4"
cyw43 = "0.7.0"
cyw43-pio = "0.10.0"

cortex-m = "0.7.9"
cortex-m-rt = "0.7"
#embedded-hal = { version = "1.0.0" }
#embedded-io = "0.7"
#embedded-hal-bus = "0.3.0"
heapless = "0.9.3"

#defmt = "1.1.1"
#defmt-serial = "0.14.0"

panic-persist = { version = "0.3", features = ["utf8"] }
#sequential-storage = "8.0.1"
#embedded-storage-async = "0.4.2"

critical-section = "1.2.0"
static_cell = "2.1.1"
portable-atomic = { version = "1", default-features = false, features = [
    "critical-section",
] }

#embedded-graphics = "0.8.2"
#ssd1306 = "0.10.0"
