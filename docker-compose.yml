# Telemetry stack: Mosquitto (broker) -> Telegraf (MQTT subscriber) -> InfluxDB (history) -> Grafana (dashboards)
# Secrets come from ./.env (git-ignored). Copy .env.example to .env first.
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,Z
    restart: unless-stopped

  influxdb:
    image: influxdb:2
    environment:
      # Only used on the very first start, when the data volume is empty.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:?set INFLUX_PASSWORD in .env}
      DOCKER_INFLUXDB_INIT_ORG: hub
      DOCKER_INFLUXDB_INIT_BUCKET: hub
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - influx-data:/var/lib/influxdb2
    restart: unless-stopped

  telegraf:
    image: telegraf:latest
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro,Z
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?set INFLUX_TOKEN in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - influxdb
    restart: unless-stopped

volumes:
  influx-data:
  grafana-data:
