# Subscribes to the board's MQTT topics and writes them to InfluxDB.
# Each input has its own client_id: two clients with the same ID would kick each other off the broker.

[agent]
  flush_interval = "2s"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  client_id = "telegraf-bme280"
  topics = ["hub/bme280"]
  data_format = "json"
  name_override = "bme280"
  topic_tag = ""

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  client_id = "telegraf-imu"
  topics = ["hub/imu"]
  data_format = "json"
  name_override = "imu"
  topic_tag = ""

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  client_id = "telegraf-range"
  topics = ["hub/range"]
  data_format = "json"
  name_override = "range"
  topic_tag = ""

# hub/log carries plain text, not JSON: store it as a string field named "value"
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  client_id = "telegraf-log"
  topics = ["hub/log"]
  data_format = "value"
  data_type = "string"
  name_override = "log"
  topic_tag = ""

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "hub"
  bucket = "hub"
